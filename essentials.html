<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --b:#5a8a6a;--b2:#4a7359;
  --txt:#111827;--t2:#6b7280;--t3:#9ca3af;
  --bg:#fff;--bg2:#f8fafc;--bg3:#f1f5f9;--bd:#e2e8f0;
  --ok:#059669;--warn:#d97706;--r:#dc2626;
  --bl:#f0f5f1;--bd2:#cbd5e1;
  --rr:16px;--rrs:10px;--rrxs:6px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.08);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
  --dur:.15s;
}
html{scroll-behavior:smooth;}
body{overflow-x:hidden;font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;background:var(--bg2);color:var(--txt);font-size:15px;line-height:1.6;display:flex;flex-direction:column;min-height:100vh;}
strong,b{font-weight:600;}

/* ══ 상단 비워둠 ══ */
.site-nav-placeholder{display:none;}

/* ══ subnav — 체크리스트·템플릿과 동일 ══ */
.detail-subnav{height:52px;display:flex;align-items:center;border-bottom:1px solid var(--bd);background:#fff;flex-shrink:0;}
.detail-subnav-inner{max-width:1000px;width:100%;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:flex;align-items:center;justify-content:space-between;}
.detail-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--b);background:none;border:none;cursor:pointer;padding:0;text-decoration:none;}
.detail-back:hover{opacity:.75;}
.detail-subnav-links{display:flex;align-items:center;gap:4px;}
.detail-subnav-links a{font-size:12px;font-weight:600;color:var(--t2);padding:5px 10px;border-radius:var(--rrs);text-decoration:none;transition:all var(--dur);}
.detail-subnav-links a:hover{background:var(--bg3);color:var(--txt);}
.blog-btn{font-size:12px!important;font-weight:700!important;padding:5px 13px!important;border-radius:var(--rrs)!important;border:1.5px solid var(--b)!important;color:var(--b)!important;background:#fff!important;}
.blog-btn:hover{background:var(--b)!important;color:#fff!important;}
@media(max-width:600px){.detail-subnav-links{display:none;}}

/* ══ 헤더 — 체크리스트·템플릿과 동일 ══ */
.head-outer{border-bottom:1px solid var(--bd);background:#fff;}
.detail-head{padding:16px clamp(16px,4vw,32px) 14px;max-width:1000px;margin:0 auto;}
.detail-head-wrap{display:flex;align-items:flex-start;gap:14px;}
.detail-icon{width:44px;height:44px;border-radius:12px;background:#fff7ed;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.detail-title{font-size:18px;font-weight:800;color:var(--txt);margin-bottom:2px;}
.detail-desc{font-size:12px;color:var(--t2);}

/* ══ 쿠팡 면책 ══ */
.affiliate-notice{background:#fffbeb;border-bottom:1px solid #fde68a;padding:8px clamp(16px,4vw,32px);font-size:11px;color:#92400e;text-align:center;}
.last-updated{font-size:11px;color:var(--t3);text-align:center;padding:6px clamp(16px,4vw,32px) 0;}

/* ══ 카테고리 탭 필터 ══ */
.cat-filter{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:90;}
.cat-filter-inner{max-width:1000px;margin:0 auto;padding:0 clamp(16px,4vw,32px);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;height:54px;align-items:center;}
.cat-filter-inner::-webkit-scrollbar{display:none;}
.cf-btn{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:20px;border:1px solid var(--bd);background:#fff;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;letter-spacing:-.01em;}
.cf-btn .cf-cnt{font-size:11px;opacity:.7;}
.cf-btn:hover{border-color:var(--b);color:var(--b);}
.cf-btn.on{background:var(--b);border-color:var(--b);color:#fff;font-weight:700;}

/* ══ 메인 ══ */
.main{flex:1;padding:24px clamp(16px,4vw,32px) 60px;max-width:1000px;width:100%;margin:0 auto;}

/* ══ 상품 그리드 ══ */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 16px;}

/* ══ 상품 카드 ══ */
.p-card{background:#fff;border-radius:14px;display:flex;flex-direction:column;transition:transform .2s cubic-bezier(.4,0,.2,1);}
.p-card:hover{transform:translateY(-3px);}
.p-card:hover .p-img{border-color:#d4dfd7;}
.p-card:hover .p-btn{background:var(--b2);}

/* 이미지 — 순수 중성 배경, 카테고리 색 제거 */
.p-img{width:100%;aspect-ratio:1/1;background:#f6f7f6;border:1px solid var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative;transition:border-color .2s;}
.p-img img{width:100%;height:100%;object-fit:cover;}
.p-img.no-img::after{content:"";width:34px;height:34px;border:2px solid #d8ddd9;border-radius:7px;opacity:.55;}

/* 본문 — 카테고리 → 제품명 → 브랜드 → 설명 → 가격 */
.p-body{padding:12px 2px 0;flex:1;display:flex;flex-direction:column;}
.p-cat-line{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.02em;margin-bottom:5px;}
.p-name{font-size:14.5px;font-weight:700;color:var(--txt);line-height:1.4;letter-spacing:-.01em;margin-bottom:3px;word-break:keep-all;}
.p-brand{font-size:11.5px;color:var(--t3);font-weight:500;margin-bottom:7px;}
.p-desc{font-size:12.5px;color:var(--t2);line-height:1.65;flex:1;word-break:keep-all;}
.p-tip{margin-top:9px;padding:10px 11px;background:#f7f9f8;border-radius:8px;font-size:12px;line-height:1.7;color:var(--t2);word-break:keep-all;}
.p-tip-label{display:block;font-size:10.5px;font-weight:700;color:var(--b2);margin-bottom:3px;letter-spacing:.01em;}
.p-meta{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);}
.p-badge-rec{font-size:11px;font-weight:600;color:var(--b2);white-space:nowrap;}
.p-price{font-size:13px;font-weight:700;color:var(--txt);margin-left:auto;white-space:nowrap;letter-spacing:-.01em;}

/* 버튼 — 세이지그린 통일 */
.p-footer{padding:11px 0 0;}
.p-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:10px;background:var(--b);color:#fff;border-radius:9px;font-size:12.5px;font-weight:700;text-decoration:none;transition:background .18s;letter-spacing:-.01em;}
.p-btn.empty{background:transparent;color:var(--t3);border:1px solid var(--bd);cursor:default;font-weight:600;}
.p-card:hover .p-btn.empty{background:transparent;}

/* ══ 빈 상태 ══ */
.empty-state{text-align:center;padding:60px 20px;color:var(--t3);}
.empty-state .big{font-size:40px;margin-bottom:12px;}

/* ══ 로딩·오류 ══ */
.loading-msg{text-align:center;padding:60px 20px;color:var(--t3);font-size:14px;}
.error-msg{background:#fef2f2;border:1.5px solid #fecaca;border-radius:var(--rrs);padding:14px 18px;margin-bottom:20px;font-size:13px;color:#dc2626;}

/* ══ 맨위로 버튼 ══ */
.to-top{position:fixed;bottom:24px;right:20px;width:40px;height:40px;background:#fff;border:1.5px solid var(--bd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;}
.to-top.show{opacity:1;pointer-events:auto;}

/* ══ 하단 비워둠 ══ */
.site-footer-placeholder{display:none;}

@media(max-width:480px){
  .product-grid{grid-template-columns:1fr 1fr;gap:18px 12px;}
  .p-body{padding:10px 1px 0;}
  .p-name{font-size:13.5px;}
  .p-desc{font-size:11.5px;line-height:1.6;}
  .p-tip{font-size:11px;padding:8px 9px;line-height:1.65;}
  .p-price{font-size:12.5px;}
  .p-btn{padding:9px;font-size:12px;}
}
@media(max-width:340px){.product-grid{grid-template-columns:1fr;}}
/* ── AD-SLOT-V1 ── */
.ad-slot{margin:0 auto;max-width:1100px;min-height:0;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:var(--rrs);color:var(--t3);font-size:12px;text-align:center;overflow:hidden;}
.ad-slot .ad-label{opacity:.6;}
.ad-slot ins{display:block;width:100%;}
@media print{.ad-slot{display:none!important;}}
/* ── AD-SLOT-V1 END ── */

// ════════════════════════════════════════════════════════════════
// 렌더링 로직 — 수정 불필요
// ════════════════════════════════════════════════════════════════
let allProducts = [];
let currentCat = 'all';

function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function getCat(id){ return CATS.find(c=>c.id===id)||{color:'#6b7280',bg:'#f1f5f9',icon:'🛒',name:id}; }

// 카드 빌드 — 카테고리 → 제품명 → 브랜드 → 설명 → [추천 · 가격] → 버튼
function buildCard(p) {
  const cat = getCat(p.cat);
  const imgHtml = p.img
    ? `<div class="p-img"><img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.remove();this.parentElement.classList.add('no-img');"></div>`
    : `<div class="p-img no-img"></div>`;
  const btnHtml = p.url
    ? `<a class="p-btn" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer sponsored">상품 보러가기</a>`
    : `<span class="p-btn empty">링크 준비 중</span>`;
  const badgeHtml = p.badge ? `<span class="p-badge-rec">${esc(p.badge)}</span>` : '';
  return `<div class="p-card">
    ${imgHtml}
    <div class="p-body">
      <div class="p-cat-line">${esc(cat.name)} · ${esc(p.period)}</div>
      <div class="p-name">${esc(p.name)}</div>
      <div class="p-brand">${esc(p.brand)}</div>
      <div class="p-desc">${esc(p.desc)}</div>
      ${p.tip ? `<div class="p-tip"><span class="p-tip-label">이렇게 쓰면 좋아요</span>${esc(p.tip)}</div>` : ''}
      <div class="p-meta">
        ${badgeHtml}
        <span class="p-price">${esc(p.price)}</span>
      </div>
      <div class="p-footer">${btnHtml}</div>
    </div>
  </div>`;
}

// 탭 필터 빌드
function buildCatFilter(products) {
  const inner = document.getElementById('cat-filter-inner');
  const totalCnt = products.length;
  inner.innerHTML = `<button class="cf-btn on" onclick="filterCat('all',this)">전체 <span class="cf-cnt">${totalCnt}</span></button>` +
    CATS.map(cat => {
      const cnt = products.filter(p=>p.cat===cat.id).length;
      if(!cnt) return '';
      return `<button class="cf-btn" onclick="filterCat('${cat.id}',this)">${cat.icon} ${cat.name} <span class="cf-cnt">${cnt}</span></button>`;
    }).join('');
}

// 필터링 후 그리드 렌더
function filterCat(catId, btn) {
  currentCat = catId;
  document.querySelectorAll('.cf-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const filtered = catId==='all' ? allProducts : allProducts.filter(p=>p.cat===catId);
  renderGrid(filtered);
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderGrid(products) {
  const grid = document.getElementById('product-grid');
  if(!products.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><div class="big">🔍</div>상품이 없습니다.</div>`;
    return;
  }
  grid.innerHTML = products.map(buildCard).join('');
}

// 구글 시트 CSV 파싱
function parseCSV(csv) {
  const lines = csv.trim().split('\n');
  if(lines.length<2) return [];
  const headers = lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line=>{
    const vals=[]; let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){inQ=!inQ;}
      else if(line[i]===','&&!inQ){vals.push(cur.trim());cur='';}
      else{cur+=line[i];}
    }
    vals.push(cur.trim());
    const obj={};
    headers.forEach((h,i)=>{obj[h]=(vals[i]||'').replace(/^"|"$/g,'');});
    return obj;
  }).filter(p=>p.cat&&p.name);
}

// 구글 시트 로드
async function loadFromSheet() {
  if(!SHEET_ID||SHEET_ID==='YOUR_SHEET_ID_HERE'){
    allProducts=DEFAULT_PRODUCTS;
    buildCatFilter(allProducts);
    renderGrid(allProducts);
    const _ld=document.getElementById('loading'); if(_ld) _ld.style.display='none';
    applyUrlCat();
    return;
  }
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=products`;
  try{
    const res=await fetch(url);
    if(!res.ok) throw new Error('시트 로드 실패');
    const csv=await res.text();
    const products=parseCSV(csv);
    if(!products.length) throw new Error('데이터 없음');
    allProducts=products;
  }catch(e){
    console.warn('시트 로드 실패, 기본 데이터 사용:', e.message);
    allProducts=DEFAULT_PRODUCTS;
    const grid=document.getElementById('product-grid');
    grid.insertAdjacentHTML('beforebegin',`<div class="error-msg">⚠️ 구글 시트를 불러오지 못했습니다. 기본 데이터를 표시합니다.</div>`);
  }finally{
    buildCatFilter(allProducts);
    renderGrid(allProducts);
    const _ld=document.getElementById('loading'); if(_ld) _ld.style.display='none';
    applyUrlCat();
  }
}

// URL 파라미터 ?cat= 으로 특정 탭 자동 활성화
// 체크리스트·템플릿에서 보내는 값 → CATS id 매핑
function applyUrlCat() {
  const param = new URLSearchParams(location.search).get('cat');
  if(!param) return;
  // delivery(출산)는 newborn 탭으로 연결
  const aliasMap = { delivery:'newborn' };
  const catId = aliasMap[param] || param;
  if(!CATS.find(c=>c.id===catId)) return; // 존재하지 않는 카테고리면 전체 유지
  currentCat = catId;
  document.querySelectorAll('.cf-btn').forEach(b=>{
    const onclickAttr = b.getAttribute('onclick') || '';
    b.classList.toggle('on', onclickAttr.includes(`'${catId}'`));
  });
  const filtered = allProducts.filter(p=>p.cat===catId);
  renderGrid(filtered);
}

// 맨위로 버튼
window.addEventListener('scroll',()=>{
  document.getElementById('to-top').classList.toggle('show',window.scrollY>300);
},{passive:true});

loadFromSheet();
